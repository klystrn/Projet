<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in to Projet</title>
<meta name="description" content="Log in to your Projet account.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400,300&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<meta name="theme-color" content="#14130f">
<script>document.documentElement.classList.remove("no-js");</script>
</head>
<body>

<!--
  THE V2 IMAGE-ASIDE AUTH SHELL. Restored (Aug 2026) in place of the
  split-spectrum stage that briefly replaced it — see the comment above
  .auth-page in assets/site.css for the full history and what's archived
  where. login.html and signup.html carry mirrored layouts (image aside on
  opposite sides) rather than identical markup, matching how this shell
  worked in v2: login's aside is on the left, signup's is on the right.
-->
<div class="auth-page">

  <aside class="auth-aside">
    <img class="texture" src="assets/fluid.webp" alt="">
    <a href="index.html" class="logo">
      <img class="logo-img" src="assets/logo-white.png" alt="Projet" width="267" height="88">
    </a>
    <p class="auth-quote">Where businesses with problems meet builders with potential.</p>
    <div class="auth-stats">
      <span>Post a challenge</span>
      <span>Compete on real work</span>
      <span>Get hired</span>
    </div>
  </aside>

  <main class="auth-main">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-lede">Pick up where your challenges left off.</p>

      <div class="auth-status" role="status" aria-live="polite"></div>

      <!--
        FRONT-END ONLY. No credentials are sent anywhere yet.
        Backend hook: site.js reads data-endpoint and POSTs JSON
        {email, password} to it. Point it at the real route
        (e.g. /api/auth/login) and the form starts working as-is.
      -->
      <form id="loginForm" data-auth-form data-endpoint="" novalidate>

        <div class="field">
          <label for="li-email">Email</label>
          <input id="li-email" name="email" type="email" autocomplete="email" required>
          <span class="err">Please enter a valid email address.</span>
        </div>

        <div class="field">
          <label for="li-password">Password</label>
          <input id="li-password" name="password" type="password" autocomplete="current-password" required>
          <span class="err">Please enter your password.</span>
        </div>

        <button type="submit" class="btn btn-primary auth-submit">Log in</button>
      </form>

      <p class="auth-alt">New to Projet? <a href="signup.html">Create an account</a></p>
    </div>
  </main>

</div>

<script src="assets/site.js"></script>
</body>
</html>
